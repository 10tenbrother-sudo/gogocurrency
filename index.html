<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0C12" />
    <title>FlowMonitor - Currency Strength Dashboard</title>
    <meta name="description" content="Real-time interactive currency strength and capital flow monitor inspired by currency-strength.com, featuring multi-timeframe analytics, interactive charts, and pair divergence." />
    <meta property="og:title" content="FlowMonitor - Currency Strength Dashboard" />
    <meta property="og:description" content="Real-time interactive currency strength and capital flow monitor inspired by currency-strength.com, featuring multi-timeframe analytics, interactive charts, and pair divergence." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('flowmonitor_theme');
          var isDark = saved !== 'light';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-cyan-500/20 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
